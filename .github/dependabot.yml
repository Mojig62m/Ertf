version: 2
updates:
  # وابستگی‌های اپلیکیشن
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # اکشن‌های گیت‌هاب
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  # ایمیج پایهٔ Docker
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
